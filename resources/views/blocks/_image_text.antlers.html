<section class="flex flex-col md:flex-row md:pl-10">
    <div class="px-5 pt-[70px] pb-[31px] md:flex-1 md:px-[10px] md:pb-[70px]">
        <h2 class="font-serif text-[42px] leading-[51px] text-primary md:leading-[54px]">{{ heading }}</h2>
        <div class="mt-[39px] text-[16px] leading-[22.4px] md:mt-10 md:leading-6 [&_p+p]:mt-5">{{ text }}</div>
    </div>
    <div class="px-[10px] md:w-[41.94%] md:shrink-0 md:px-0">
        {{ partial:img :image="image" sizes="(min-width: 1025px) 604px, (min-width: 768px) 42vw, 100vw" class="h-auto w-full" }}
    </div>
</section>
