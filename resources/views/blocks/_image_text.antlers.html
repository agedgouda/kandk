<section class="flex flex-col lg:flex-row lg:items-stretch lg:pl-10">
    <div class="px-5 py-[70px] lg:w-[57.5%] lg:px-[30px]">
        <h2 class="font-serif text-[32px] leading-[1.25] text-primary md:text-[42px] md:leading-[54px]">{{ heading }}</h2>
        <div class="mt-10 text-[16px] leading-6 [&_p+p]:mt-5">{{ text }}</div>
    </div>
    <div class="lg:ml-auto lg:w-[41%]">
        {{ partial:img :image="image" sizes="(min-width: 1024px) 50vw, 100vw" class="h-full w-full object-cover" }}
    </div>
</section>
