<section class="flex flex-col lg:flex-row lg:pl-10">
    <div class="px-5 pt-[70px] pb-[31px] lg:flex-1 lg:px-[10px] lg:pb-[70px]">
        <h2 class="font-serif text-[42px] leading-[51px] text-primary md:leading-[54px]">{{ heading }}</h2>
        <div class="mt-[39px] text-[16px] leading-[22.4px] md:mt-10 md:leading-6 [&_p+p]:mt-5">{{ text }}</div>
    </div>
    <div class="px-[10px] lg:w-[41.94%] lg:shrink-0 lg:px-0">
        {{ partial:img :image="image" sizes="(min-width: 1024px) 604px, 100vw" class="h-auto w-full" }}
    </div>
</section>
