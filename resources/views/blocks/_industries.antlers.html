<section class="px-5 pt-[60px] md:px-10">
    <h2 class="px-5 text-[22px] leading-[34px] text-primary md:leading-[54px]">{{ heading }}</h2>
    <ul class="mt-5 px-[10px] md:columns-2 md:gap-10">
        {{ items }}
            <li class="break-inside-avoid border-b border-[#bbcfdb] py-[10px] text-[22px] leading-[54px] text-secondary">{{ value }}</li>
        {{ /items }}
    </ul>
</section>
