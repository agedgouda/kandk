<section class="px-10 pt-[60px]">
    <h2 class="text-[22px] leading-[51px] text-primary max-md:-mx-[30px] md:leading-[54px]">{{ heading }}</h2>
    {{# The live site shows the first two names a little smaller than the rest #}}
    <ul class="mt-[50px] space-y-5 px-[10px] text-center md:columns-2 md:gap-5">
        {{ items }}
            <li class="break-inside-avoid leading-[51px] text-[#0f8bb8] md:leading-[54px] {{ index < 2 ? 'text-[22px]' : 'text-[24px] font-light' }}">{{ value }}</li>
        {{ /items }}
    </ul>
</section>
