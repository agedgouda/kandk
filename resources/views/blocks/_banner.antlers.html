<section class="relative mt-[50px] flex h-[300px] items-center overflow-hidden md:h-[400px] md:pl-10">
    {{ partial:img :image="image" priority="true" class="absolute inset-0 size-full object-cover" }}
    <div class="absolute inset-0 bg-[linear-gradient(90deg,#15517d_0%,rgba(255,255,255,0.3)_100%)] opacity-75"></div>
    <h1 class="relative max-w-[750px] p-[10px] px-5 font-serif text-[36px] leading-[48px] font-medium text-white md:px-[30px] md:text-[52px] md:leading-[72px]">{{ heading | nl2br }}</h1>
</section>
