<section class="relative flex min-h-[500px] items-center overflow-hidden py-[120px]">
    {{ partial:img :image="image" class="absolute inset-0 size-full object-cover" }}
    <div class="absolute inset-0 bg-[linear-gradient(264deg,#15517d_31%,rgba(21,81,125,0.15)_79%)] opacity-[0.76]"></div>
    <div class="relative grid w-full gap-5 px-5 lg:grid-cols-[619px_1fr] lg:pr-[77px] lg:pl-0">
        <div class="hidden lg:block"></div>
        <div class="p-[10px] text-white">
            <h2 class="font-serif text-[32px] leading-[1.25] md:text-[42px] md:leading-[52px]">{{ title }}</h2>
            <h3 class="mt-5 text-[22px] leading-[1.4] md:text-[26px] md:leading-[32px]">{{ subtitle }}</h3>
            <p class="mt-5 text-[16px] leading-6">{{ text }}</p>
            <div class="mt-10 text-right">
                <a href="{{ button_url }}" class="inline-block rounded-[3px] bg-secondary px-6 py-3 text-[18px] leading-[18px] uppercase transition-colors hover:bg-accent">{{ button_text }}</a>
            </div>
        </div>
    </div>
</section>
