<a href="{{ button_url }}" class="group relative flex min-h-[450px] items-center justify-center overflow-hidden px-10 py-[60px] text-center text-white">
    {{ partial:img :image="image" class="absolute inset-0 size-full object-cover transition-transform duration-[1500ms] group-hover:scale-110" }}
    <span class="absolute inset-0 bg-primary/40"></span>
    <span class="relative block">
        <span class="block font-serif text-[32px] leading-[1.25] md:text-[42px] md:leading-[54px]">{{ heading }}</span>
        <span class="mt-[15px] inline-block rounded-[3px] border-2 border-white px-6 py-3 text-[18px] leading-[18px] uppercase transition-colors group-hover:bg-white group-hover:text-primary">{{ button_text }}</span>
    </span>
</a>
