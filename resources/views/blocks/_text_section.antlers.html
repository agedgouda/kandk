{{ if style == 'band' }}
    {{# Full-width blue band with centered white text #}}
    <section class="bg-secondary px-[10px] pt-[30px] pb-[50px] text-center text-white md:px-10 md:pt-[60px] md:pb-[200px]">
        <h2 class="font-serif text-[29px] leading-10 md:text-[42px] md:leading-[54px]">{{ heading }}</h2>
        {{ if text }}<div class="mt-5 text-[18px] leading-[27px] md:mt-20 md:text-[22px] md:leading-[33px] [&_strong]:font-bold">{{ text }}</div>{{ /if }}
    </section>
{{ else }}
    <section class="mt-[var(--above-phone)] pr-[10px] pl-[var(--indent-phone)] md:mt-[var(--above)] md:pr-[50px] md:pl-[var(--indent)]" style="--indent: {{ indent !== null ? indent : 50 }}px; --indent-phone: {{ indent_phone !== null ? indent_phone : 10 }}px; --above: {{ space_above !== null ? space_above : 80 }}px; --above-phone: {{ space_above_phone !== null ? space_above_phone : 80 }}px; --h-phone: {{ heading_size_phone !== null ? heading_size_phone : 32 }}px; --gap: {{ text_gap !== null ? text_gap : 40 }}px; --gap-phone: {{ text_gap_phone !== null ? text_gap_phone : 30 }}px">
        {{ if !heading }}
        {{ elseif heading_style == 'large' }}
            <h2 class="font-serif text-[length:var(--h-phone)] leading-[51px] text-primary md:text-[42px] md:leading-[54px]">{{ heading }}</h2>
        {{ else }}
            <h2 class="text-[22px] leading-[51px] text-primary md:leading-[54px]">{{ heading }}</h2>
        {{ /if }}
        {{ if text }}<div class="{{ !heading ? '' : (heading_style == 'large' ? 'mt-[var(--gap-phone)] md:mt-[var(--gap)]' : 'mt-5') }} {{ system_font ? 'font-system tracking-normal' : '' }} text-[16px] leading-[1.4] md:leading-6 [&_a]:text-[#0f8bb8] [&_a:hover]:text-primary [&_p+p]:mt-5 [&_strong]:font-bold">{{ text }}</div>{{ /if }}
    </section>
{{ /if }}
