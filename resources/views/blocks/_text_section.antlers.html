<section class="mt-20 px-5 md:px-[50px]">
    {{ if heading_style == 'large' }}
        <h2 class="font-serif text-[32px] leading-[1.25] text-primary md:text-[42px] md:leading-[54px]">{{ heading }}</h2>
    {{ else }}
        <h2 class="text-[22px] leading-[34px] text-primary md:leading-[54px]">{{ heading }}</h2>
    {{ /if }}
    {{ if text }}<div class="mt-5 text-[16px] leading-6 [&_p+p]:mt-4 [&_strong]:font-bold">{{ text }}</div>{{ /if }}
</section>
