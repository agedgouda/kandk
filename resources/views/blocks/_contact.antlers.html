<section class="flex flex-col gap-10 px-5 py-[80px] md:px-[50px] lg:flex-row">
    <div class="lg:w-[62%]">
        {{ partial:form form="contact" }}
    </div>
    <div class="lg:w-[38%] lg:pl-10">
        <h2 class="font-serif text-[28px] leading-[34px] text-primary">{{ heading }}</h2>
        <ul class="mt-6 space-y-4 text-[16px] leading-6 text-primary">
            <li class="flex gap-3"><svg class="mt-1 size-4 shrink-0 fill-secondary" viewBox="0 0 384 512" aria-hidden="true"><path d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 85.961 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0zM192 272c44.183 0 80-35.817 80-80s-35.817-80-80-80-80 35.817-80 80 35.817 80 80 80z"/></svg><span>{{ settings:address | nl2br }}</span></li>
            <li class="flex gap-3"><svg class="mt-1 size-4 shrink-0 fill-secondary" viewBox="0 0 512 512" aria-hidden="true"><path d="M497.39 361.8l-112-48a24 24 0 0 0-28 6.9l-49.6 60.6A370.66 370.66 0 0 1 130.6 204.11l60.6-49.6a23.94 23.94 0 0 0 6.9-28l-48-112A24.16 24.16 0 0 0 122.6.61l-104 24A24 24 0 0 0 0 48c0 256.5 207.9 464 464 464a24 24 0 0 0 23.4-18.6l24-104a24.29 24.29 0 0 0-14.01-27.6z"/></svg><a href="tel:{{ settings:phone | replace('(', '') | replace(')', '') | replace(' ', '-') }}" class="hover:text-secondary">{{ settings:phone }}</a></li>
            <li class="flex gap-3"><svg class="mt-1 size-4 shrink-0 fill-secondary" viewBox="0 0 512 512" aria-hidden="true"><path d="M128 0C92.7 0 64 28.7 64 64v96h64V64h226.7L384 93.3V160h64V93.3c0-17-6.7-33.3-18.7-45.3L400 18.7C388 6.7 371.7 0 354.7 0H128zM384 352v32 64H128V384 368 352H384zm64 32h32c17.7 0 32-14.3 32-32V256c0-35.3-28.7-64-64-64H64c-35.3 0-64 28.7-64 64v96c0 17.7 14.3 32 32 32H64v64c0 35.3 28.7 64 64 64H384c35.3 0 64-28.7 64-64V384z"/></svg><span>{{ settings:fax }}</span></li>
        </ul>
    </div>
</section>
{{ if map_heading }}
    <section class="px-5 pb-[80px] md:px-[50px]">
        <h2 class="mb-6 font-serif text-[32px] leading-[1.25] text-primary md:text-[42px] md:leading-[54px]">{{ map_heading }}</h2>
        <iframe class="h-[450px] w-full border-0" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map" src="https://maps.google.com/maps?q={{ settings:address | replace('\n', ' ') | urlencode }}&output=embed"></iframe>
    </section>
{{ /if }}
