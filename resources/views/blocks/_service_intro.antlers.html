<section class="flex flex-col lg:flex-row">
    <div class="bg-mist p-[10px] lg:w-[64.1%]">
        <div class="px-5 py-5 md:px-10">
            <h2 class="font-serif text-[30px] leading-[1.3] text-primary md:text-[42px] md:leading-[54px]">{{ heading }}</h2>
            <div class="mt-5 text-[18px] leading-[28px] text-primary md:text-[22px] md:leading-[33px] [&_p]:mb-5">{{ text }}</div>
        </div>
    </div>
    <nav class="bg-primary px-10 py-5 lg:w-[35.9%]" aria-label="Services">
        <ul class="divide-y divide-white font-serif text-[24px] leading-[30px] md:text-[28px] md:leading-[34px]">
            {{ nav:services_sidebar }}
                <li class="py-[25px] first:pt-[25px]">
                    <a href="{{ url }}" class="{{ is_current ? 'text-secondary' : 'text-white hover:text-secondary' }}">{{ title }}</a>
                </li>
            {{ /nav:services_sidebar }}
        </ul>
    </nav>
</section>
