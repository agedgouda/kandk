<article class="p-[10px]">
    <div class="h-full bg-white">
        <a href="{{ url }}" class="block"><img src="{{ image:url }}" alt="" class="aspect-[3/2] w-full object-cover"></a>
        <div class="p-[15px]">
            <h3 class="mt-[10px] font-serif text-[24px] leading-[54px]"><a href="{{ url }}" class="text-primary hover:text-secondary">{{ title }}</a></h3>
            <p class="text-[14px] leading-[21px]">{{ excerpt }}</p>
            <a href="{{ url }}" class="block pt-5 text-[16px] leading-6 uppercase text-secondary hover:text-primary">Read More</a>
        </div>
    </div>
</article>
