title: Post
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field: { type: text, display: Title, required: true }
          -
            handle: image
            field: { type: assets, display: 'Featured Image', container: assets, folder: blog, max_files: 1 }
          -
            handle: excerpt
            field: { type: textarea, display: 'Short Summary', instructions: 'Shown in the post lists.' }
          -
            handle: source_url
            field: { type: text, display: 'Original Article Link', instructions: 'If set, the post page links here to read the full article.' }
          -
            handle: content
            field: { type: bard, display: Content, buttons: [h2, h3, bold, italic, unorderedlist, orderedlist, quote, anchor], save_html: false }
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field: { type: slug, localizable: true }
          -
            handle: date
            field: { type: date, display: Date, required: true }
